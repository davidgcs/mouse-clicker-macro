<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Mouse Macro Recorder</title>
  <defs>
    <radialGradient id="bg" cx="600" cy="300" r="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e1a3a"/>
      <stop offset=".5" stop-color="#080d1b"/>
      <stop offset="1" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="ambient" cx="600" cy="315" r="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f6bff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="600" cy="315" r="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fade-mask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#7aa7ff" stroke-opacity=".09"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#7aa7ff"/>
    </pattern>
    <linearGradient id="trail-left" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#7aa7ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#bcd3ff"/>
    </linearGradient>
    <linearGradient id="trail-right" x1="690" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bcd3ff" stop-opacity="0"/>
      <stop offset=".1" stop-color="#bcd3ff"/>
      <stop offset=".5" stop-color="#7aa7ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pointer" x1="13" y1="11" x2="35" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="record" x1="38" y1="12" x2="51" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7a8c"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <path id="pointer-shape" d="M13 11v36.3l9.2-8.6 6.2 14.1 5.7-2.4-5.9-13.7h11.2Z"/>
    <path id="trail-l" d="M-30 372C80 372 120 262 214 246S350 172 428 148"/>
    <path id="trail-r" d="M690 352C770 340 800 420 880 410S1040 330 1230 380"/>
    <g id="click">
      <circle r="26" fill="none" stroke="#7aa7ff" stroke-opacity=".25" stroke-width="2"/>
      <circle r="15" fill="none" stroke="#7aa7ff" stroke-opacity=".6" stroke-width="2"/>
      <circle r="5" fill="#cfe0ff"/>
    </g>
    <g id="sparkle">
      <path d="M-6 0H6M0-6V6" fill="none" stroke="#9db9ff" stroke-linecap="round" stroke-width="1.6"/>
    </g>
    <filter id="blur-trail" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blur-lg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4"/></filter>
    <filter id="blur-md" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#fade-mask)"/>
  <rect x="24" y="446" width="112" height="126" fill="url(#dots)" opacity=".3"/>
  <rect x="1062" y="50" width="112" height="112" fill="url(#dots)" opacity=".25"/>
  <rect width="1200" height="630" fill="url(#ambient)"/>

  <g fill="none" stroke-linecap="round">
    <use xlink:href="#trail-l" stroke="url(#trail-left)" stroke-width="10" stroke-opacity=".5" filter="url(#blur-trail)"/>
    <use xlink:href="#trail-l" stroke="url(#trail-left)" stroke-opacity=".35" stroke-width="1.5"/>
    <use xlink:href="#trail-l" stroke="url(#trail-left)" stroke-dasharray="0.1 15" stroke-width="5"/>
    <use xlink:href="#trail-r" stroke="url(#trail-right)" stroke-width="10" stroke-opacity=".5" filter="url(#blur-trail)"/>
    <use xlink:href="#trail-r" stroke="url(#trail-right)" stroke-opacity=".35" stroke-width="1.5"/>
    <use xlink:href="#trail-r" stroke="url(#trail-right)" stroke-dasharray="0.1 15" stroke-width="5"/>
  </g>
  <use xlink:href="#click" x="98" y="315" opacity=".5"/>
  <use xlink:href="#click" x="214" y="246" opacity=".8"/>
  <use xlink:href="#click" x="327" y="200"/>
  <use xlink:href="#click" x="785" y="380" opacity=".85"/>
  <use xlink:href="#click" x="880" y="410" opacity=".6"/>
  <use xlink:href="#click" x="1014" y="372" opacity=".4"/>

  <use xlink:href="#sparkle" x="293" y="72" opacity=".5"/>
  <use xlink:href="#sparkle" x="882" y="70" opacity=".55"/>
  <use xlink:href="#sparkle" x="1000" y="110" opacity=".4"/>
  <use xlink:href="#sparkle" x="915" y="190" opacity=".3"/>
  <use xlink:href="#sparkle" x="112" y="440" opacity=".35"/>
  <use xlink:href="#sparkle" x="86" y="126" opacity=".3"/>
  <use xlink:href="#sparkle" x="1100" y="483" opacity=".4"/>
  <use xlink:href="#sparkle" x="684" y="566" opacity=".3"/>

  <g transform="translate(350.8 66.2) scale(7.8)">
    <circle cx="44.5" cy="19.5" r="12.8" fill="none" stroke="#ff4d6a" stroke-opacity=".55" stroke-width=".5"/>
    <circle cx="44.5" cy="19.5" r="18.4" fill="none" stroke="#ff4d6a" stroke-opacity=".28" stroke-width=".4"/>
    <use xlink:href="#pointer-shape" fill="#2563eb" stroke="#2563eb" stroke-linejoin="round" stroke-width="5" opacity=".9" filter="url(#blur-lg)"/>
    <circle cx="44.5" cy="19.5" r="9" fill="#ef4444" opacity=".85" filter="url(#blur-lg)"/>
    <use xlink:href="#pointer-shape" fill="#4f8cff" stroke="#4f8cff" stroke-linejoin="round" stroke-width="3.6" opacity=".55" filter="url(#blur-md)"/>
    <use xlink:href="#pointer-shape" fill="#cfe0ff" stroke="#cfe0ff" stroke-linejoin="round" stroke-width="4"/>
    <use xlink:href="#pointer-shape" fill="url(#pointer)" stroke="url(#pointer)" stroke-linejoin="round" stroke-width="3.2"/>
    <circle cx="44.5" cy="19.5" r="8.4" fill="#ffc2cb"/>
    <circle cx="44.5" cy="19.5" r="8" fill="url(#record)"/>
  </g>
</svg>
